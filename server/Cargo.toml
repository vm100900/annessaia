[package]
name = "annessaia-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rand = "0.8"
# Optional: pulls in a ~1.3GB model download on first use. On by default so
# `cargo build` behaves the same as before this was a feature at all — build
# with --no-default-features for a lean, keyword-only-search node.
fastembed = { version = "5", optional = true }
base64 = "0.22"

[features]
default = ["ai"]
ai = ["dep:fastembed"]
